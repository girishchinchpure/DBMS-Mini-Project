{% extends 'base.html' %}
{% block content %}
<div class="page-head"><div><p class="eyebrow">Curriculum</p><h1>Courses</h1></div></div>
<section class="card"><div class="table-wrap"><table>
<thead><tr><th>Code</th><th>Course</th><th>Credits</th><th>Semester</th><th>Department</th><th>Faculty</th></tr></thead>
<tbody>{% for c in courses %}<tr><td>{{ c.course_code }}</td><td>{{ c.course_name }}</td><td>{{ c.credits }}</td><td>{{ c.semester }}</td><td>{{ c.department_name }}</td><td>{{ c.faculty_name or 'Unassigned' }}</td></tr>{% endfor %}</tbody>
</table></div></section>
{% endblock %}
